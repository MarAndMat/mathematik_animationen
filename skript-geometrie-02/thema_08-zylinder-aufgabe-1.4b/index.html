<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aufgabe b – Quader mit Halbzylinder</title>
<style>
  :root { --accent:#00C4FF; --accent-dark:#0090BF; --text:#111318; --muted:#4A4F5C; --line:#D5D9E0; --panel:#F5F8FB; --orange:#E8590C; }
  * { box-sizing: border-box; }
  body { margin:0; background:#FFFFFF; color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:4px 0 2px; font-weight:650; }
  .sub { color:var(--muted); margin:0 0 14px; font-size:15px; }
  .grid { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
  .stage { flex: 999 1 560px; min-width:0; }
  canvas { display:block; width:100%; height:auto; aspect-ratio: 16 / 10; background:#FFFFFF; border:1px solid var(--line); border-radius:10px; }
  .panel { flex: 1 1 300px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .panel h2 { font-size:17px; margin:0 0 8px; }
  .note { font-size:14px; color:var(--muted); margin:0 0 10px; }
  .note .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:4px; border:1px solid rgba(0,0,0,.25); }
  ol { margin:0; padding-left:20px; }
  li { margin:0 0 10px; font-size:16px; line-height:1.45; opacity:0; transform: translateY(4px); transition: opacity .35s, transform .35s; }
  li.shown { opacity:.75; transform:none; }
  li.current { opacity:1; }
  li strong { font-size:18px; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:12px; }
  button { font:inherit; font-size:15px; padding:10px 16px; min-height:44px; border-radius:8px; border:1px solid var(--accent-dark); background:var(--accent); color:#002A38; cursor:pointer; }
  button.secondary { background:#FFFFFF; color:var(--text); border-color:#B8BEC9; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--accent-dark); outline-offset:2px; }
  input[type=range] { flex:1 1 200px; accent-color:var(--accent-dark); min-height:44px; }
  .time { font-variant-numeric: tabular-nums; color:var(--muted); font-size:14px; min-width:7ch; text-align:right; }
  .sr { position:absolute; left:-9999px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Aufgabe b – Quader mit Halbzylinder</h1>
  <p class="sub">Würfel: 10 cm × 10 cm × 10 cm</p>
  <div class="grid">
    <div class="stage">
      <canvas id="c" width="960" height="600" aria-label="Animation: Der Körper wird in einen Quader und einen Halbzylinder zerlegt, die nebeneinander gelegt werden"></canvas>
      <div class="controls">
        <button id="play" type="button">Pause</button>
        <button id="restart" type="button" class="secondary">Von vorne</button>
        <label for="scrub" class="sr">Zeitpunkt</label>
        <input id="scrub" type="range" min="0" max="1000" value="0">
        <span class="time" id="time">0,0 s</span>
      </div>
    </div>
    <div class="panel">
      <h2>Berechnung</h2>
      <p class="note">Der Körper wird in seine Teile zerlegt.</p>
      <ol id="steps"></ol>
    </div>
  </div>
</div>
<script>
(function () {
  const D = Math.PI / 180;
  const BLUE = '#00C4FF', VIOLET = '#7A8CFF', ORANGE = '#FF8A3D';
  // ---------- Profile-Helfer (x nach rechts, y nach oben, Tiefe z 0..10) ----------
  function arc(cx, cy, r, a0, a1, n) {
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const a = (a0 + (a1 - a0) * i / n) * D;
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a), (i > 0 && i < n) ? 1 : 0]);
    }
    return pts;
  }
  function poly(...parts) {            // Teile verbinden, doppelte Punkte entfernen
    const out = [];
    for (const part of parts) for (const p of part) {
      const q = out[out.length - 1];
      if (q && Math.abs(q[0] - p[0]) < 1e-9 && Math.abs(q[1] - p[1]) < 1e-9) { q[2] = q[2] && p[2]; continue; }
      out.push([p[0], p[1], p[2] || 0]);
    }
    const f = out[0], l = out[out.length - 1];
    if (Math.abs(f[0] - l[0]) < 1e-9 && Math.abs(f[1] - l[1]) < 1e-9) out.pop();
    let A = 0;
    for (let i = 0; i < out.length; i++) { const a = out[i], b = out[(i + 1) % out.length]; A += a[0] * b[1] - b[0] * a[1]; }
    if (A < 0) out.reverse();
    return out;
  }
  const rect = (x0, y0, x1, y1) => poly([[x0, y0], [x1, y0], [x1, y1], [x0, y1]]);
  const circle = (cx, cy, r) => { const a = arc(cx, cy, r, 0, 360, 96); a.pop(); return poly(a.map(p => [p[0], p[1], 1])); };

  const SCENE = {
  T: 9.5, ghost: true,
  solids: [
    { prof: rect(0, 0, 10, 5), color: BLUE, labels: [['Quader', 3.8, 1e9]] },
    { prof: poly(arc(5, 5, 5, 0, 180, 64)), color: VIOLET, moves: [[1.2, 2.2, [0, 2.5, 0]], [2.2, 3.8, [13, -7.5, 0]]], labels: [['Halbzylinder', 3.8, 1e9]] }
  ],
  steps: [
    [1.4, 'Der Körper besteht aus zwei Teilen.'],
    [4.0, 'Quader: 10&nbsp;cm · 10&nbsp;cm · 5&nbsp;cm = 500&nbsp;cm³'],
    [5.4, 'Halbzylinder (r&nbsp;=&nbsp;5&nbsp;cm, h&nbsp;=&nbsp;10&nbsp;cm):<br>½ · π · (5&nbsp;cm)² · 10&nbsp;cm ≈ 392,70&nbsp;cm³'],
    [6.8, '<strong>V = 500&nbsp;cm³ + 392,70&nbsp;cm³ ≈ 892,70&nbsp;cm³</strong>']
  ]};

  // ---------- Kamera ----------
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const norm = a => { const n = Math.hypot(a[0], a[1], a[2]); return [a[0]/n, a[1]/n, a[2]/n]; };
  const az = 28, el = 22;
  const VD = [Math.sin(az*D)*Math.cos(el*D), Math.sin(el*D), -Math.cos(az*D)*Math.cos(el*D)];
  const RV = norm(cross(VD, [0, 1, 0])), UV = cross(RV, VD);
  const LIGHT = norm([-0.35, 0.8, -0.55]);
  const proj = p => [dot(p, RV), dot(p, UV), dot(p, VD)];

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = 960, H = 600;

  const ease = x => { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); };
  const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  function colorAt(s, t) {
    if (!s.colorTo) return hex(s.color);
    const k = ease((t - s.colorT[0]) / (s.colorT[1] - s.colorT[0]));
    const a = hex(s.color), b = hex(s.colorTo);
    return a.map((v, i) => v + (b[i] - v) * k);
  }
  function shade(rgb, n) {
    const diff = Math.max(0, dot(n, LIGHT));
    const k = 0.58 + 0.42 * diff;
    return 'rgb(' + rgb.map(v => Math.round(Math.min(255, v * k * 0.82 + 255 * 0.18))).join(',') + ')';
  }
  function offsetAt(s, t) {
    const o = [0, 0, 0];
    for (const [t0, t1, v] of (s.moves || [])) { const k = ease((t - t0) / (t1 - t0)); o[0] += v[0]*k; o[1] += v[1]*k; o[2] += v[2]*k; }
    return o;
  }
  const shownAt = (s, t) => !s.show || (t >= s.show[0] && t < s.show[1]);

  // ---------- Einpassen ----------
  let SC = 1, OX = 0, OY = 0;
  (function fit() {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    const add = p => { const q = proj(p); x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); };
    for (const s of SCENE.solids) for (const t of [0, SCENE.T]) {
      const o = offsetAt(s, t);
      const Z = s.z || [0, 10];
      for (const p of s.prof) { add([p[0]+o[0], p[1]+o[1], Z[0]+o[2]]); add([p[0]+o[0], p[1]+o[1], Z[1]+o[2]]); }
    }
    for (const x of [0, 10]) for (const y of [0, 10]) for (const z of [0, 10]) add([x, y, z]);
    const m = 40, top = 50;
    SC = Math.min((W - 2*m) / (x1 - x0), (H - m - top) / (y1 - y0));
    OX = W / 2 - SC * (x0 + x1) / 2;
    OY = top + (H - m - top) / 2 + SC * (y0 + y1) / 2;
  })();
  const scr = q => [OX + q[0] * SC, OY - q[1] * SC];

  const EDGE = '#0B3A52';
  function path(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
  function seg(a, b) { ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }

  function drawPrism(s, t) {
    const P = s.prof, n = P.length, o = offsetAt(s, t), rgb = colorAt(s, t);
    const Z = s.z || [0, 10];
    const pf = P.map(p => proj([p[0]+o[0], p[1]+o[1], Z[0]+o[2]]));
    const pb = P.map(p => proj([p[0]+o[0], p[1]+o[1], Z[1]+o[2]]));
    const convex = P.map((p, k) => { const a = P[(k - 1 + n) % n], b = P[(k + 1) % n]; return (p[0]-a[0])*(b[1]-p[1]) - (p[1]-a[1])*(b[0]-p[0]) > 0; });
    const sf = pf.map(scr), sb = pb.map(scr);
    const vis = [], faces = [];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const nr = norm([P[j][1] - P[i][1], -(P[j][0] - P[i][0]), 0]);
      vis[i] = dot(nr, VD) > 1e-6;
      if (vis[i]) faces.push({ i, j, nr, depth: Math.max(pf[i][2], pf[j][2], pb[i][2], pb[j][2]) });
    }
    faces.sort((a, b) => a.depth - b.depth);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (dot([0, 0, 1], VD) > 0) { path(sb); ctx.fillStyle = shade(rgb, [0,0,1]); ctx.fill(); ctx.strokeStyle = EDGE; ctx.lineWidth = 1.8; ctx.stroke(); }
    for (const f of faces) {
      const { i, j } = f;
      const col = shade(rgb, f.nr);
      path([sf[i], sf[j], sb[j], sb[i]]);
      ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
      ctx.beginPath(); ctx.strokeStyle = EDGE; ctx.lineWidth = 1.8;
      seg(sb[i], sb[j]);
      const pi = (i - 1 + n) % n;
      if (!P[i][2] || (!vis[pi] && convex[i])) seg(sf[i], sb[i]);
      if (!P[j][2] || (!vis[j] && convex[j])) seg(sf[j], sb[j]);
      ctx.stroke();
    }
    path(sf); ctx.fillStyle = shade(rgb, [0, 0, -1]); ctx.fill();
    ctx.strokeStyle = EDGE; ctx.lineWidth = 2; ctx.stroke();
  }

  const CUBE_V = [];
  for (const x of [0, 10]) for (const y of [0, 10]) for (const z of [0, 10]) CUBE_V.push([x, y, z]);
  const CUBE_E = [];
  for (let a = 0; a < 8; a++) for (let b = a + 1; b < 8; b++) {
    const d = CUBE_V[a].reduce((s, v, k) => s + (v !== CUBE_V[b][k] ? 1 : 0), 0);
    if (d === 1) CUBE_E.push([a, b]);
  }
  function ghost(hidden) {
    ctx.save(); ctx.strokeStyle = '#8A93A3'; ctx.lineWidth = 1.4;
    for (const [a, b] of CUBE_E) {
      const A = CUBE_V[a], B = CUBE_V[b];
      const isHidden = [A, B].some(v => v[0] === 0 && v[1] === 0 && v[2] === 10);
      if (isHidden !== hidden) continue;
      ctx.setLineDash(hidden ? [4, 5] : []);
      ctx.beginPath(); seg(scr(proj(A)), scr(proj(B))); ctx.stroke();
    }
    ctx.restore();
  }

  function label(text, s, t) {
    const o = offsetAt(s, t);
    let x0 = 1e9, x1 = -1e9, y0 = 1e9;
    for (const p of s.prof) for (const z of (s.z || [0, 10])) {
      const q = scr(proj([p[0]+o[0], p[1]+o[1], z+o[2]]));
      x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]);
    }
    ctx.font = '600 17px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    const w = ctx.measureText(text).width + 16, cx = (x0 + x1) / 2, cy = y0 - 18;
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.strokeStyle = '#B8BEC9'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(cx - w/2, cy - 14, w, 28, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111318'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, cx, cy + 1);
  }

  function draw(t) {
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
    if (SCENE.ghost) ghost(true);
    const live = SCENE.solids.filter(s => shownAt(s, t)).map(s => {
      const o = offsetAt(s, t);
      let cx = 0, cy = 0; for (const p of s.prof) { cx += p[0]; cy += p[1]; }
      const Z = s.z || [0, 10];
      return { s, depth: proj([cx / s.prof.length + o[0], cy / s.prof.length + o[1], (Z[0] + Z[1]) / 2 + o[2]])[2] };
    }).sort((a, b) => a.depth - b.depth);
    for (const { s } of live) drawPrism(s, t);
    if (SCENE.ghost) ghost(false);
    for (const { s } of live) for (const [text, t0, t1] of (s.labels || [])) if (t >= t0 && t < t1) label(text, s, t);
  }

  // ---------- Rechenschritte ----------
  const stepsEl = document.getElementById('steps');
  const lis = SCENE.steps.map(([t, html]) => { const li = document.createElement('li'); li.innerHTML = html; stepsEl.appendChild(li); return li; });
  function updateSteps(t) {
    let cur = -1;
    SCENE.steps.forEach(([ts], i) => { const on = t >= ts; lis[i].classList.toggle('shown', on); if (on) cur = i; });
    lis.forEach((li, i) => li.classList.toggle('current', i === cur));
  }

  // ---------- Steuerung ----------
  const playBtn = document.getElementById('play'), restartBtn = document.getElementById('restart');
  const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  const TOTAL = SCENE.T;
  let t = 0, playing = true, last = null;
  function fitCanvas() { const dpr = Math.min(window.devicePixelRatio || 1, 2); canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function render() {
    draw(t); updateSteps(t);
    scrub.value = Math.round(t / TOTAL * 1000);
    timeEl.textContent = t.toFixed(1).replace('.', ',') + ' s';
    playBtn.textContent = playing ? 'Pause' : (t >= TOTAL ? 'Nochmals' : 'Abspielen');
  }
  function loop(now) {
    if (playing) { if (last !== null) t += (now - last) / 1000; if (t >= TOTAL) { t = TOTAL; playing = false; } render(); }
    last = now; requestAnimationFrame(loop);
  }
  playBtn.addEventListener('click', () => { if (!playing && t >= TOTAL) t = 0; playing = !playing; last = null; render(); });
  restartBtn.addEventListener('click', () => { t = 0; playing = true; last = null; render(); });
  scrub.addEventListener('input', () => { playing = false; t = scrub.value / 1000 * TOTAL; render(); });
  window.addEventListener('resize', () => { fitCanvas(); render(); });
  window.seekTo = s => { playing = false; t = s; render(); };
  fitCanvas(); render(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
