<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zylinderoberfläche: O = 2 · r · (r + h) · π</title>
<style>
  :root { --accent:#00C4FF; --accent-dark:#0090BF; --text:#111318; --muted:#4A4F5C; --line:#D5D9E0; --panel:#F5F8FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:#FFFFFF; color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:4px 0 14px; font-weight:650; }
  .grid { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
  .stage { flex: 999 1 560px; min-width:0; }
  canvas { display:block; width:100%; height:auto; aspect-ratio: 16 / 10; background:#FFFFFF; border:1px solid var(--line); border-radius:10px; }
  .panel { flex: 1 1 290px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .panel h2 { font-size:17px; margin:0 0 8px; }
  .note { font-size:14px; color:var(--muted); margin:0 0 10px; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:3px; vertical-align:-1px; margin-right:4px; border:1px solid rgba(0,0,0,.25); }
  ol { margin:0; padding-left:20px; }
  li { margin:0 0 10px; font-size:16px; line-height:1.45; opacity:0; transform: translateY(4px); transition: opacity .35s, transform .35s; }
  li.shown { opacity:.75; transform:none; }
  li.current { opacity:1; }
  li strong { font-size:18px; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:12px; }
  button { font:inherit; font-size:15px; padding:10px 16px; min-height:44px; border-radius:8px; border:1px solid var(--accent-dark); background:var(--accent); color:#002A38; cursor:pointer; }
  button.secondary { background:#FFFFFF; color:var(--text); border-color:#B8BEC9; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--accent-dark); outline-offset:2px; }
  input[type=range] { flex:1 1 200px; accent-color:var(--accent-dark); min-height:44px; }
  .time { font-variant-numeric: tabular-nums; color:var(--muted); font-size:14px; min-width:7ch; text-align:right; }
  .sr { position:absolute; left:-9999px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Zylinderoberfläche: O = 2 · r · (r + h) · π</h1>
  <div class="grid">
    <div class="stage">
      <canvas id="c" width="960" height="600" aria-label="Animation: Deckel und Boden lösen sich, der Mantel wird zu einem Rechteck abgerollt, daraus ergibt sich die Oberflächenformel"></canvas>
      <div class="controls">
        <button id="play" type="button">Pause</button>
        <button id="restart" type="button" class="secondary">Von vorne</button>
        <label for="scrub" class="sr">Zeitpunkt</label>
        <input id="scrub" type="range" min="0" max="1000" value="0">
        <span class="time" id="time">0,0 s</span>
      </div>
    </div>
    <div class="panel">
      <h2>So entsteht die Formel</h2>
      <p class="note"><span class="sw" style="background:#C9F1FF"></span>Grundfläche G / Deckfläche D &nbsp; <span class="sw" style="background:#FFB27A"></span>Mantel M</p>
      <ol id="steps"></ol>
    </div>
  </div>
</div>
<script>
(function () {
  const W = 960, H = 600, CX = 330, R = 80, RY = 26, BY = 385, HT = 170, TY = BY - HT, U = 2 * Math.PI * R, N = 120;
  const INK = '#111318', RED = '#C23F1C', GREEN = '#0F6E56', BLUE_E = '#0090BF', OR_E = '#B4500F';
  const T = { show:[0.2,1.0], dims:[0.8,1.6], lids:[2.6,4.2], unroll:[4.6,7.6], mdims:[7.7,8.4],
              f1:[8.8,9.5], f2:[10.0,10.7], f3:[11.4,12.1], end:15 };
  const STEPS = [
    [0.4, 'Ein Zylinder mit dem Radius r und der Höhe h.'],
    [2.6, 'Grundfläche G und Deckfläche D sind zwei gleiche Kreise: G = D = r² · π.'],
    [4.6, 'Der Mantel wird abgerollt. Es entsteht ein Rechteck.'],
    [7.7, 'Breite des Rechtecks = Kreisumfang 2 · r · π,<br>Höhe = h.'],
    [8.8, 'Mantelfläche: M = 2 · r · h · π'],
    [10.0, 'Oberfläche = Grundfläche + Deckfläche + Mantel<br>O = 2 · r² · π + 2 · r · h · π'],
    [11.4, '<strong>Ausklammern:<br>O = 2 · r · (r + h) · π</strong>']
  ];
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
  const ease = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const ph = (iv, t) => ease((t - iv[0]) / (iv[1] - iv[0]));
  const lerp = (a, b, k) => a + (b - a) * k;
  function label(str, x, y, opt) {
    opt = opt || {};
    ctx.save(); ctx.globalAlpha = opt.alpha == null ? 1 : opt.alpha;
    let f = (opt.weight || 600) + ' ' + (opt.size || 22) + 'px ' + (opt.serif ? '"Times New Roman", Georgia, serif' : 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif');
    if (opt.italic) f = 'italic ' + f;
    ctx.font = f; ctx.textAlign = opt.align || 'center'; ctx.textBaseline = 'middle';
    if (opt.box) {
      const w = ctx.measureText(str).width + 20, s = opt.size || 22;
      const bx = opt.align === 'left' ? x - 10 : opt.align === 'right' ? x - w + 10 : x - w / 2;
      ctx.fillStyle = opt.fill || 'rgba(255,255,255,0.94)'; ctx.strokeStyle = opt.stroke || '#B8BEC9'; ctx.lineWidth = opt.stroke ? 2 : 1;
      ctx.beginPath(); ctx.roundRect(bx, y - s * 0.95, w, s * 1.9, 9); ctx.fill(); ctx.stroke();
    }
    ctx.fillStyle = opt.color || INK; ctx.fillText(str, x, y + 1);
    ctx.restore();
  }
  let hatch = null;
  function getHatch() {
    if (hatch) return hatch;
    const p = document.createElement('canvas'); p.width = p.height = 12;
    const g = p.getContext('2d'); g.strokeStyle = 'rgba(0,144,191,0.55)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(0, 12); g.lineTo(12, 0); g.moveTo(-3, 3); g.lineTo(3, -3); g.moveTo(9, 15); g.lineTo(15, 9); g.stroke();
    hatch = ctx.createPattern(p, 'repeat'); return hatch;
  }
  function lid(cy, ry, alpha) {
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.ellipse(CX, cy, R, Math.max(ry, 0.5), 0, 0, 2 * Math.PI);
    ctx.fillStyle = '#C9F1FF'; ctx.fill();
    ctx.strokeStyle = '#0B3A52'; ctx.lineWidth = 2.2; ctx.stroke(); ctx.restore();
  }
  function mantle(p) {               // p = 0: Zylinder, 1: flaches Rechteck
    const c = (1 - p) / R, tilt = RY / R;
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const u = (i / N - 0.5) * U;
      let X, Z;
      if (c < 1e-6) { X = u; Z = 0; } else { X = Math.sin(u * c) / c; Z = (1 - Math.cos(u * c)) / c; }
      pts.push([CX + X, -Z * tilt, u]);
    }
    const strips = [];
    for (let i = 0; i < N; i++) {
      const a = pts[i], b = pts[i + 1];
      const nx = (b[1] - a[1]), facing = (b[0] - a[0]) > 0;       // vorne: von links nach rechts
      strips.push({ i, a, b, depth: -(a[1] + b[1]) / 2, facing });
    }
    strips.sort((s1, s2) => s2.depth - s1.depth);
    for (const s of strips) {
      const { a, b, facing } = s;
      const dx = b[0] - a[0], len = Math.hypot(dx, b[1] - a[1]) || 1, light = 0.6 + 0.4 * Math.abs(dx / len);
      const base = facing ? [255, 178, 122] : [245, 222, 205];
      const col = 'rgb(' + base.map(v => Math.round(v * (0.78 + 0.22 * light))).join(',') + ')';
      ctx.beginPath(); ctx.moveTo(a[0], BY + a[1]); ctx.lineTo(b[0], BY + b[1]); ctx.lineTo(b[0], TY + b[1]); ctx.lineTo(a[0], TY + a[1]); ctx.closePath();
      ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
      ctx.strokeStyle = OR_E; ctx.lineWidth = 2; ctx.beginPath();
      if (facing || p > 0.02) { ctx.moveTo(a[0], BY + a[1]); ctx.lineTo(b[0], BY + b[1]); ctx.moveTo(a[0], TY + a[1]); ctx.lineTo(b[0], TY + b[1]); }
      if (s.i === 0 || s.i === N - 1) { const e = s.i === 0 ? a : b; if (p > 0.01) { ctx.moveTo(e[0], BY + e[1]); ctx.lineTo(e[0], TY + e[1]); } }
      ctx.stroke();
    }
    // Umriss links/rechts im Zylinderzustand
    if (p < 0.02) { ctx.strokeStyle = OR_E; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(CX - R, BY - RY); ctx.lineTo(CX - R, TY - RY); ctx.moveTo(CX + R, BY - RY); ctx.lineTo(CX + R, TY - RY); ctx.stroke(); }
  }

  function draw(t) {
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
    const pshow = ph(T.show, t), pl = ph(T.lids, t), pu = ph(T.unroll, t);
    ctx.save(); ctx.globalAlpha = pshow;
    // Boden
    lid(lerp(BY - RY, BY + R + 2, pl), lerp(RY, R, pl), 1);
    mantle(pu);
    // Deckel
    lid(lerp(TY - RY, TY - R - 2, pl), lerp(RY, R, pl), 1);
    ctx.restore();

    // r und h am Zylinder
    const pd = ph(T.dims, t) * (1 - ph([T.lids[0], T.lids[0] + 0.4], t));
    if (pd > 0) {
      ctx.save(); ctx.globalAlpha = pd; ctx.strokeStyle = RED; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(CX, TY - RY); ctx.lineTo(CX + R, TY - RY); ctx.stroke(); ctx.restore();
      label('r', CX + R / 2, TY - RY - 16, { alpha: pd, color: RED, serif: true, italic: true, size: 28, weight: 400 });
      const x = CX + R + 28;
      ctx.save(); ctx.globalAlpha = pd; ctx.strokeStyle = GREEN; ctx.lineWidth = 2.5; ctx.beginPath();
      ctx.moveTo(x, BY - RY); ctx.lineTo(x, TY - RY); ctx.moveTo(x - 8, BY - RY); ctx.lineTo(x + 8, BY - RY); ctx.moveTo(x - 8, TY - RY); ctx.lineTo(x + 8, TY - RY); ctx.stroke(); ctx.restore();
      label('h', x + 20, (BY + TY) / 2 - RY, { alpha: pd, color: GREEN, serif: true, italic: true, size: 30, weight: 400 });
    }
    // G-Beschriftungen auf den Kreisen
    const pg = ph([T.lids[1] - 0.3, T.lids[1] + 0.3], t);
    if (pg > 0) {
      label('D', CX - R * 0.35, TY - R + 30, { alpha: pg, serif: true, italic: true, size: 30, weight: 400 });
      label('G', CX, BY + R + 4, { alpha: pg, serif: true, italic: true, size: 30, weight: 400 });
      ctx.save(); ctx.globalAlpha = pg; ctx.strokeStyle = RED; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(CX, TY - R - 2); ctx.lineTo(CX + R, TY - R - 2); ctx.stroke(); ctx.restore();
      label('r', CX + R * 0.62, TY - R - 18, { alpha: pg, color: RED, serif: true, italic: true, size: 24, weight: 400 });
      label('G = D = r² · π', CX + R + 18, TY - R - 30, { alpha: pg, align: 'left', size: 18, box: true });
    }
    // Mantelmasse
    const pm = ph(T.mdims, t);
    if (pm > 0) {
      const x0 = CX - U / 2, x1 = CX + U / 2, y = BY - 24;
      label('M', CX, (TY + BY) / 2 - 22, { alpha: pm, serif: true, italic: true, size: 34, weight: 400, color: OR_E });
      ctx.save(); ctx.globalAlpha = pm; ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath();
      ctx.moveTo(x0 + 6, y); ctx.lineTo(x1 - 6, y);
      ctx.moveTo(x0 + 16, y - 6); ctx.lineTo(x0 + 6, y); ctx.lineTo(x0 + 16, y + 6);
      ctx.moveTo(x1 - 16, y - 6); ctx.lineTo(x1 - 6, y); ctx.lineTo(x1 - 16, y + 6); ctx.stroke(); ctx.restore();
      label('Breite = Umfang = 2 · r · π', CX - U / 4, y - 20, { alpha: pm, size: 17, weight: 500 });
      const x = x1 + 22;
      ctx.save(); ctx.globalAlpha = pm; ctx.strokeStyle = GREEN; ctx.lineWidth = 2.5; ctx.beginPath();
      ctx.moveTo(x, BY); ctx.lineTo(x, TY); ctx.moveTo(x - 8, BY); ctx.lineTo(x + 8, BY); ctx.moveTo(x - 8, TY); ctx.lineTo(x + 8, TY); ctx.stroke(); ctx.restore();
      label('h', x + 18, (BY + TY) / 2, { alpha: pm, color: GREEN, serif: true, italic: true, size: 30, weight: 400 });
    }
    // Formeln rechts
    const FX = 790, f1 = ph(T.f1, t), f2 = ph(T.f2, t), f3 = ph(T.f3, t);
    if (f1 > 0) { label('M = 2 · r · h · π', FX, 150, { alpha: f1, size: 22 }); label('G + D = 2 · r² · π', FX, 195, { alpha: f1, size: 22 }); }
    if (f2 > 0) { label('O = G + D + M', FX, 265, { alpha: f2, size: 19, color: '#4A4F5C', weight: 500 }); label('O = 2·r²·π + 2·r·h·π', FX, 305, { alpha: f2, size: 23 }); }
    if (f3 > 0) label('O = 2·r·(r + h)·π', FX, 385, { alpha: f3, size: 26, weight: 700, box: true, fill: 'rgba(0,196,255,0.14)', stroke: BLUE_E });
  }

  // ---------- Rechenschritte ----------
  const stepsEl = document.getElementById('steps');
  const lis = STEPS.map(([, html]) => { const li = document.createElement('li'); li.innerHTML = html; stepsEl.appendChild(li); return li; });
  function updateSteps(t) {
    let cur = -1;
    STEPS.forEach(([ts], i) => { const on = t >= ts; lis[i].classList.toggle('shown', on); if (on) cur = i; });
    lis.forEach((li, i) => li.classList.toggle('current', i === cur));
  }

  // ---------- Steuerung ----------
  const playBtn = document.getElementById('play'), restartBtn = document.getElementById('restart');
  const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  const TOTAL = T.end;
  let t = 0, playing = true, last = null;
  function fitCanvas() { const dpr = Math.min(window.devicePixelRatio || 1, 2); canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  function render() {
    draw(t); updateSteps(t);
    scrub.value = Math.round(t / TOTAL * 1000);
    timeEl.textContent = t.toFixed(1).replace('.', ',') + ' s';
    playBtn.textContent = playing ? 'Pause' : (t >= TOTAL ? 'Nochmals' : 'Abspielen');
  }
  function loop(now) {
    if (playing) { if (last !== null) t += (now - last) / 1000; if (t >= TOTAL) { t = TOTAL; playing = false; } render(); }
    last = now; requestAnimationFrame(loop);
  }
  playBtn.addEventListener('click', () => { if (!playing && t >= TOTAL) t = 0; playing = !playing; last = null; render(); });
  restartBtn.addEventListener('click', () => { t = 0; playing = true; last = null; render(); });
  scrub.addEventListener('input', () => { playing = false; t = scrub.value / 1000 * TOTAL; render(); });
  window.addEventListener('resize', () => { fitCanvas(); render(); });
  window.seekTo = s => { playing = false; t = s; render(); };
  fitCanvas(); render(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
